<svg xmlns="http://www.w3.org/2000/svg" width="122" height="99" viewBox="0 0 122 99">
  <!-- وحدة زخرفة أوراق — كيف الضيافة | متجهية 100% للطباعة الفاخرة
       الوحدة = ورقتان علويتان + ورقتان سفليتان بإزاحة + 4 نقاط -->
  <defs>
    <g id="leaf">
      <!-- الساق -->
      <path d="M0,25 L0,35" fill="none" stroke="#D2A374" stroke-width="1.8" stroke-linecap="round"/>
      <!-- جسم الورقة: بيضاوي عريض مدبّب الطرفين -->
      <path d="M0,-28 C11,-17.5 16,-7 16,2.5 C16,12.5 9,21 0,25 C-9,21 -16,12.5 -16,2.5 C-16,-7 -11,-17.5 0,-28 Z"
            fill="none" stroke="#D2A374" stroke-width="2" stroke-linejoin="round"/>
      <!-- العرق الأوسط -->
      <path d="M0,-24 L0,24" fill="none" stroke="#D2A374" stroke-width="1.6"/>
      <!-- عروق شيفرون منحنية -->
      <g fill="none" stroke="#D2A374" stroke-width="1.4" stroke-linecap="round">
        <path d="M-8.5,-10.5 Q0,-16   8.5,-10.5"/>
        <path d="M-12,-1.5   Q0,-7.5  12,-1.5"/>
        <path d="M-13,7.5    Q0,1.5   13,7.5"/>
        <path d="M-10,16     Q0,10    10,16"/>
      </g>
    </g>
  </defs>

  <!-- الصف العلوي -->
  <use href="#leaf" x="18"  y="30"/>
  <use href="#leaf" x="79"  y="30"/>
  <circle cx="48.5"  cy="28" r="3.4" fill="#D2A374"/>
  <circle cx="109.5" cy="28" r="3.4" fill="#D2A374"/>

  <!-- الصف السفلي بإزاحة نصف وحدة + ميل خفيف -->
  <g transform="rotate(-13 48.5 71)"><use href="#leaf" x="48.5" y="71"/></g>
  <g transform="rotate(-13 109.5 71)"><use href="#leaf" x="109.5" y="71"/></g>
  <circle cx="18" cy="74" r="3.4" fill="#D2A374"/>
  <circle cx="79" cy="74" r="3.4" fill="#D2A374"/>
</svg>
