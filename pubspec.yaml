name: keif_diafa
description: كيف الضيافة — نظام الفواتير وكشوف الحساب
publish_to: 'none'
version: 2.4.0+6

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: 6.1.5+1
  hive: 2.2.3
  hive_flutter: 1.1.0
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^10.1.4
  path_provider: 2.1.5
  file_picker: 11.0.3
  open_filex: 4.7.0
  crypto: 3.0.7
  permission_handler: ^11.3.1
  google_sign_in: 6.2.2
  url_launcher: 6.3.1
  # قاعدة البيانات: SQLite (WAL + معاملات) على أندرويد — Hive يبقى للويب ولترحيل البيانات القديمة
  sqflite: 2.4.2
  sqflite_common: 2.5.6
  path: 1.9.1
  # النسخ السحابي إلى Google Drive
  googleapis: 12.0.0
  extension_google_sign_in_as_googleapis_auth: 2.0.13
  http: 1.6.0
  # حالة الترخيص (القفل عن بُعد) — مستقلة عن قاعدة البيانات
  shared_preferences: 2.5.3

# نسخة pdf 3.12.0 محلية مع تصحيح مسافات RTL — انظر third_party/pdf/KEIF_PATCH.md
dependency_overrides:
  pdf:
    path: third_party/pdf

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: 2.3.7+1

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    # هوية كل نسخة (شعار/ختم للواجهة و PDF) — الاختيار في lib/core/brand.dart
    - assets/brand/keif/
    - assets/brand/osool/
    - assets/ic/
    - assets/fonts/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900
